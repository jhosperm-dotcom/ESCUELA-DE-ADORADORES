<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escuela de Adoradores</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            color: #333;
        }
        
        /* Encabezado Azul Original */
        .header {
            background-color: #5c6bc0;
            color: white;
            padding: 40px 20px 60px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
        }
        .header p {
            margin: 10px 0 0 0;
            font-size: 1rem;
            font-weight: 300;
        }
        
        /* Contenedor principal blanco */
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 600px;
            margin: -40px auto 40px auto;
            box-sizing: border-box;
            min-height: 400px;
        }

        .pantalla {
            display: none;
            text-align: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        .activa {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { font-size: 1.5rem; margin-bottom: 20px; color: #1f2937; text-align: left; }
        .subtitle { color: #6b7280; margin-bottom: 25px; font-size: 0.95rem; text-align: center; }

        /* Contenedor para los botones de colores de la foto */
        .grid-grupos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        /* Estilo general de botones */
        button {
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            width: 100%;
        }
        button:active { transform: scale(0.98); }
        button:hover { opacity: 0.9; }

        /* Botones de Inicio */
        .btn-maestro { background-color: #f48fb1; color: white; border-radius: 50px; }
        .btn-lider { background-color: #111827; color: white; border-radius: 50px; }
        
        /* Botones de Grupos (estilo de la foto con bordes de colores) */
        .btn-outline {
            background-color: #fafafa;
            border: 2px solid #ccc;
            color: #333;
            border-radius: 15px;
            padding: 20px 10px;
            font-size: 1rem;
        }
        .btn-outline-exploradores { border-color: #4caf50; color: #2e7d32; }
        .btn-outline-semillas { border-color: #009688; color: #00695c; }
        .btn-outline-vencedores { border-color: #ff9800; color: #e65100; }
        .btn-outline-visionarios { border-color: #f44336; color: #c62828; }

        .btn-domingo { background-color: #fce7f3; color: #9d174d; border-radius: 50px; margin-bottom: 10px; }
        .btn-primary { background-color: #5c6bc0; color: white; border-radius: 50px; margin-top: 20px; }
        .btn-back { background-color: transparent; color: #6b7280; margin-top: 20px; font-weight: normal; text-decoration: underline; }

        /* Pestañas (Tabs) */
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e5e7eb;
        }
        .tab {
            flex: 1;
            padding: 12px;
            background: none;
            color: #6b7280;
            border-radius: 0;
            font-weight: bold;
        }
        .tab.activa {
            color: #5c6bc0;
            border-bottom: 3px solid #5c6bc0;
        }
        .tab-content {
            display: none;
            text-align: left;
        }
        .tab-content.activa {
            display: block;
            animation: fadeIn 0.3s;
        }

        /* Inputs */
        label {
            display: block;
            text-align: left;
            font-weight: 600;
            color: #374151;
            margin: 15px 0 5px 5px;
            font-size: 0.9rem;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 0.95rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #5c6bc0;
            background-color: #fff;
        }

        .mensaje-error { color: #ef4444; display: none; margin-bottom: 15px; }
        
        /* Tarjetas Líder */
        .registro-card {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-left: 5px solid #5c6bc0;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .registro-card h4 { margin: 0 0 10px 0; color: #5c6bc0; }
        .registro-card p { margin: 5px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="header">
    <h1>Escuela de Adoradores</h1>
    <p>Guiando a los niños en Su presencia</p>
</div>

<div class="container">
    
    <!-- 1. INICIO -->
    <div id="inicio" class="pantalla activa">
        <h2 style="text-align: center;">¡Bienvenidos!</h2>
        <p class="subtitle">Seleccionen el rol para comenzar a gestionar.</p>
        <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button class="btn-maestro" onclick="irAPantalla('seleccionar-grupo')">Soy Maestro</button>
            <button class="btn-lider" onclick="irAPantalla('login-lider')">Soy Líder</button>
        </div>
    </div>

    <!-- 2. MAESTRO: SELECCIONAR GRUPO -->
    <div id="seleccionar-grupo" class="pantalla">
        <h2>Selecciona el Grupo</h2>
        <div class="grid-grupos">
            <button class="btn-outline btn-outline-exploradores" onclick="seleccionarGrupo('Exploradores')">Exploradores</button>
            <button class="btn-outline btn-outline-semillas" onclick="seleccionarGrupo('Semillas del Reino')">Semillas del Reino</button>
            <button class="btn-outline btn-outline-vencedores" onclick="seleccionarGrupo('Vencedores')">Vencedores</button>
            <button class="btn-outline btn-outline-visionarios" onclick="seleccionarGrupo('Visionarios')">Visionarios</button>
        </div>
        <button class="btn-back" onclick="irAPantalla('inicio')">Volver al inicio</button>
    </div>

    <!-- 3. MAESTRO: SELECCIONAR SUBGRUPO -->
    <div id="seleccionar-subgrupo" class="pantalla">
        <h2>Selecciona tu Subgrupo</h2>
        <p class="subtitle" id="titulo-grupo-seleccionado" style="color: #5c6bc0; font-weight: bold;"></p>
        <div class="grid-grupos">
            <button class="btn-outline" style="border-color: #5c6bc0; color: #5c6bc0;" onclick="seleccionarSubgrupo('Grupo A')">Grupo A</button>
            <button class="btn-outline" style="border-color: #5c6bc0; color: #5c6bc0;" onclick="seleccionarSubgrupo('Grupo B')">Grupo B</button>
        </div>
        <button class="btn-back" onclick="irAPantalla('seleccionar-grupo')">Atrás</button>
    </div>

    <!-- 4. MAESTRO: SELECCIONAR DOMINGO -->
    <div id="seleccionar-domingo" class="pantalla">
        <h2>Selecciona el Domingo</h2>
        <p class="subtitle" id="info-subgrupo-seleccionado"></p>
        
        <div id="contenedor-domingos">
            <!-- Botones generados por JS -->
        </div>
        
        <button class="btn-back" onclick="irAPantalla('seleccionar-subgrupo')">Atrás</button>
    </div>

    <!-- 5. MAESTRO: FORMULARIO CON PESTAÑAS -->
    <div id="formulario-clase" class="pantalla">
        <h2 id="titulo-resumen-clase" style="text-align: center; color: #5c6bc0; font-size: 1.2rem;"></h2>
        
        <div class="tabs">
            <button class="tab activa" onclick="cambiarPestana('tab-materiales', this)">Contenido y Materiales</button>
            <button class="tab" onclick="cambiarPestana('tab-asistencia', this)">Asistencia</button>
        </div>

        <!-- Pestaña 1: Materiales -->
        <div id="tab-materiales" class="tab-content activa">
            <label>Nombre de la temática:</label>
            <input type="text" id="m-titulo" placeholder="Ej. El Buen Pastor">
            
            <label>Descripción breve de la Clase:</label>
            <textarea id="m-descripcion" rows="2" placeholder="¿De qué trata la clase?"></textarea>

            <label>Materiales necesarios:</label>
            <textarea id="m-materiales" rows="3" placeholder="Ej. Papel de colores, tijeras, pegamento..."></textarea>
        </div>

        <!-- Pestaña 2: Asistencia -->
        <div id="tab-asistencia" class="tab-content">
            <label>Registro de Asistencia:</label>
            <textarea id="m-asistencia" rows="6" placeholder="Escribe los nombres de los niños que asistieron..."></textarea>
        </div>

        <button class="btn-primary" onclick="guardarRegistro()">Guardar Información</button>
        <button class="btn-back" onclick="irAPantalla('seleccionar-domingo')">Atrás</button>
    </div>

    <!-- LOGIN LÍDER -->
    <div id="login-lider" class="pantalla">
        <h2 style="text-align: center;">Acceso Líder</h2>
        <p id="error-login" class="mensaje-error" style="text-align: center;">Contraseña incorrecta</p>
        <label>Contraseña:</label>
        <input type="password" id="password-lider" placeholder="Ingresa la contraseña">
        <button class="btn-lider" style="margin-top: 15px;" onclick="verificarPassword()">Ingresar</button>
        <button class="btn-back" onclick="irAPantalla('inicio')">Volver al inicio</button>
    </div>

    <!-- PANEL LÍDER -->
    <div id="panel-lider" class="pantalla">
        <h2>Panel Administrativo</h2>
        
        <label>Filtrar por Domingo:</label>
        <select id="l-domingo" onchange="mostrarResumenLider()">
            <option value="">Seleccione el domingo...</option>
            <option value="1 de noviembre">1 de noviembre</option>
            <option value="8 de noviembre">8 de noviembre</option>
            <option value="15 de noviembre">15 de noviembre</option>
            <option value="22 de noviembre">22 de noviembre</option>
            <option value="29 de noviembre">29 de noviembre</option>
            <option value="6 de diciembre">6 de diciembre</option>
            <option value="13 de diciembre">13 de diciembre</option>
            <option value="20 de diciembre">20 de diciembre</option>
            <option value="27 de diciembre">27 de diciembre</option>
        </select>

        <label>Filtrar por Grupo:</label>
        <select id="l-grupo" onchange="mostrarResumenLider()">
            <option value="">Seleccione un grupo...</option>
            <option value="Exploradores">Exploradores</option>
            <option value="Semillas del Reino">Semillas del Reino</option>
            <option value="Vencedores">Vencedores</option>
            <option value="Visionarios">Visionarios</option>
        </select>

        <div id="contenedor-resumen" style="margin-top: 25px; text-align: left;">
            <p style="color: #6b7280; font-size: 0.9rem; text-align: center;">Selecciona filtros para ver los reportes.</p>
        </div>
        <button class="btn-back" onclick="irAPantalla('inicio')">Cerrar Sesión</button>
    </div>

</div>

<script>
    // Variables de estado
    let seleccionActual = {
        grupo: '',
        subgrupo: '',
        domingo: ''
    };

    // Calendario Intercalado Nov-Dic
    const domingos = {
        "Grupo A": ["1 de noviembre", "15 de noviembre", "29 de noviembre", "13 de diciembre", "27 de diciembre"],
        "Grupo B": ["8 de noviembre", "22 de noviembre", "6 de diciembre", "20 de diciembre"]
    };

    function irAPantalla(idPantalla) {
        document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
        document.getElementById(idPantalla).classList.add('activa');
        if(idPantalla === 'inicio') document.getElementById('password-lider').value = '';
    }

    function seleccionarGrupo(grupo) {
        seleccionActual.grupo = grupo;
        document.getElementById('titulo-grupo-seleccionado').innerText = grupo;
        irAPantalla('seleccionar-subgrupo');
    }

    function seleccionarSubgrupo(subgrupo) {
        seleccionActual.subgrupo = subgrupo;
        document.getElementById('info-subgrupo-seleccionado').innerText = `${seleccionActual.grupo} - ${subgrupo}`;
        generarBotonesDomingo();
        irAPantalla('seleccionar-domingo');
    }

    function generarBotonesDomingo() {
        const contenedor = document.getElementById('contenedor-domingos');
        contenedor.innerHTML = '';
        
        const fechas = domingos[seleccionActual.subgrupo];
        
        fechas.forEach(fecha => {
            const btn = document.createElement('button');
            btn.className = 'btn-domingo';
            btn.innerText = fecha;
            btn.onclick = () => abrirFormularioClase(fecha);
            contenedor.appendChild(btn);
        });
    }

    function abrirFormularioClase(fecha) {
        seleccionActual.domingo = fecha;
        document.getElementById('titulo-resumen-clase').innerText = `${seleccionActual.grupo} - ${seleccionActual.subgrupo} (${fecha})`;
        
        document.getElementById('m-titulo').value = '';
        document.getElementById('m-descripcion').value = '';
        document.getElementById('m-materiales').value = '';
        document.getElementById('m-asistencia').value = '';
        
        // Resetear a pestaña principal
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('activa'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('activa'));
        document.querySelector('.tab').classList.add('activa');
        document.getElementById('tab-materiales').classList.add('activa');

        irAPantalla('formulario-clase');
    }

    function cambiarPestana(idPestana, btnElement) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('activa'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('activa'));
        
        btnElement.classList.add('activa');
        document.getElementById(idPestana).classList.add('activa');
    }

    function guardarRegistro() {
        const titulo = document.getElementById('m-titulo').value;
        const descripcion = document.getElementById('m-descripcion').value;
        const materiales = document.getElementById('m-materiales').value;
        const asistencia = document.getElementById('m-asistencia').value;

        if (!titulo || !materiales || !asistencia) {
            alert("Por favor, llena la temática, los materiales y la asistencia.");
            return;
        }

        const registro = {
            grupo: seleccionActual.grupo,
            subgrupo: seleccionActual.subgrupo,
            domingo: seleccionActual.domingo,
            titulo, descripcion, materiales, asistencia
        };

        let DB = JSON.parse(localStorage.getItem('iglesiaDB_v2')) || [];
        DB.push(registro);
        localStorage.setItem('iglesiaDB_v2', JSON.stringify(DB));

        alert("¡Información guardada con éxito!");
        irAPantalla('inicio');
    }

    function verificarPassword() {
        if (document.getElementById('password-lider').value === 'Ingri') {
            document.getElementById('error-login').style.display = 'none';
            irAPantalla('panel-lider');
            mostrarResumenLider();
        } else {
            document.getElementById('error-login').style.display = 'block';
        }
    }

    function mostrarResumenLider() {
        const d = document.getElementById('l-domingo').value;
        const g = document.getElementById('l-grupo').value;
        const contenedor = document.getElementById('contenedor-resumen');

        if (!d || !g) {
            contenedor.innerHTML = '<p style="text-align: center; color: #6b7280;">Selecciona domingo y grupo para ver datos.</p>';
            return;
        }

        let DB = JSON.parse(localStorage.getItem('iglesiaDB_v2')) || [];
        let filtrados = DB.filter(r => r.domingo === d && r.grupo === g);

        if (filtrados.length === 0) {
            contenedor.innerHTML = '<p style="color:red; text-align: center;">No hay registros cargados aún.</p>';
            return;
        }

        let html = '';
        filtrados.forEach(r => {
            html += `
                <div class="registro-card">
                    <h4>${r.subgrupo} - ${r.titulo}</h4>
                    <p><strong>Descripción:</strong> ${r.descripcion}</p>
                    <p><strong>Materiales solicitados:</strong> ${r.materiales}</p>
                    <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
                    <p><strong>Asistencia:</strong><br>${r.asistencia.replace(/\n/g, '<br>')}</p>
                </div>
            `;
        });
        contenedor.innerHTML = html;
    }
</script>
</body>
</html>
